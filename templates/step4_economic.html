<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Step 4 - Economic Indicators</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="container mt-5">

    <div class="hero">

        <p class="step-text">
            STEP 4 OF 4
        </p>

        <h2>
    <i class="bi bi-graph-up-arrow"></i>
    Economic Indicators
</h2>

        <p class="subtitle">
            Please enter the current economic indicators.
        </p>

        <!-- Progress Bar -->

        <div class="progress-wrapper">

            <span class="progress-start">75%</span>

            <div class="custom-progress">

                <div class="custom-progress-bar"
                     style="width:75%;"></div>

            </div>

            <span class="progress-end">100%</span>

        </div>

        <form action="/step4" method="POST">

            <!-- Market Indicators -->

            <div class="section-header">
                Market Indicators
            </div>

            <div class="row">

                <div class="col-md-6 mb-2">

                    <label class="form-label">
                        Employee Variation
                    </label>
                    <input type="number"
                           class="form-control"
                           name="emp_var_rate"
                           step="0.1"
                           placeholder="e.g. 1.4"
                           required>

                </div>

                <div class="col-md-6 mb-2">

                    <label class="form-label">
                        Consumer Price Index
                    </label>

                    <input type="number"
                           class="form-control"
                           name="cons_price_idx"
                           step="0.001"
                           placeholder="e.g. 93.99"
                           required>

                </div>

                <div class="col-md-6 mb-2">

                    <label class="form-label">
                        Consumer Confidence
                    </label>

                    <input type="number"
                           class="form-control"
                           name="cons_conf_idx"
                           step="0.1"
                           placeholder="e.g. -36.4"
                           required>

                </div>

                <div class="col-md-6 mb-2">

                    <label class="form-label">
                        Euribor 3M Rate
                    </label>

                    <input type="number"
                           class="form-control"
                           name="euribor3m"
                           step="0.001"
                           placeholder="e.g. 4.85"
                           required>

                </div>

            </div>

            <!-- Banking Indicators -->

            <div class="section-header">
                Banking Indicators
            </div>

            <div class="row">

                <div class="col-md-6 mb-2">

                    <label class="form-label">
                        Employees
                    </label>

                    <input type="number"
                           class="form-control"
                           name="nr_employed"
                           step="0.1"
                           placeholder="e.g. 5191"
                           required>

                </div>

                <div class="col-md-6 mb-2">

                    <label class="form-label">
                        Previous Contact Days
                    </label>

                    <input type="number"
                           class="form-control"
                           name="pdays"
                           min="0"
                           placeholder="e.g. 999"
                           required>

                </div>

            </div>

            <div class="d-flex justify-content-between mt-4">

                <a href="/step3"
                   class="btn btn-outline-secondary">

                    ← Previous

                </a>

                <button type="submit"
                        class="btn btn-primary btn-lg">

                    Review →

                </button>

            </div>

        </form>

        <p class="footer-note">

            🔒︎Your information will only be used for prediction purposes.

        </p>

    </div>

</div>

</body>

</html>
