<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Step 3 - Campaign Information</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="container mt-5">

    <div class="hero">

        <p class="step-text">
            STEP 3 OF 4
        </p>

        <h2>
    <i class="bi bi-telephone"></i>
    Campaign Information
</h2>

        <p class="subtitle">
            Please provide the campaign-related details.
        </p>

        <!-- Progress Bar -->

        <div class="progress-wrapper">

            <span class="progress-start">50%</span>

            <div class="custom-progress">

                <div class="custom-progress-bar"
                     style="width:50%;"></div>

            </div>

            <span class="progress-end">100%</span>

        </div>

        <h5 class="section-title">
            Campaign Details
        </h5>

        <form action="/step3" method="POST">

            <div class="row">

                <!-- Contact Type -->

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Contact Type
                    </label>

                    <select class="form-select"
                            name="contact"
                            required>

                        <option value="" selected disabled hidden>
                            Select Contact Type
                        </option>

                        <option value="cellular">
                            Cellular
                        </option>

                        <option value="telephone">
                            Telephone
                        </option>

                    </select>

                </div>

                <!-- Month -->

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Month
                    </label>

                    <select class="form-select"
                            name="month"
                            required>

                        <option value="" selected disabled hidden>
                            Select Month
                        </option>

                        <option value="mar">March</option>
                        <option value="apr">April</option>
                        <option value="may">May</option>
                        <option value="jun">June</option>
                        <option value="jul">July</option>
                        <option value="aug">August</option>
                        <option value="sep">September</option>
                        <option value="oct">October</option>
                        <option value="nov">November</option>
                        <option value="dec">December</option>

                    </select>

                </div>

                <!-- Day of Week -->

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Day of Week
                    </label>

                    <select class="form-select"
                            name="day_of_week"
                            required>

                        <option value="" selected disabled hidden>
                            Select Day
                        </option>

                        <option value="mon">Monday</option>
                        <option value="tue">Tuesday</option>
                        <option value="wed">Wednesday</option>
                        <option value="thu">Thursday</option>
                        <option value="fri">Friday</option>

                    </select>

                </div>

                <!-- Campaign Contacts -->

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Campaign Contacts
                    </label>

                    <input type="number"
                           class="form-control"
                           name="campaign"
                           min="1"
                           required>

                </div>

                <!-- Previous Contacts -->

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Previous Contacts
                    </label>

                    <input type="number"
                           class="form-control"
                           name="previous"
                           min="0"
                           required>

                </div>

                <!-- Campaign Outcome -->

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Campaign Outcome
                    </label>

                    <select class="form-select"
                            name="poutcome"
                            required>

                        <option value="" selected disabled hidden>
                            Select Campaign Outcome
                        </option>

                        <option value="failure">
                            Failure
                        </option>

                        <option value="success">
                            Success
                        </option>

                        <option value="nonexistent">
                            Nonexistent
                        </option>

                    </select>

                </div>

            </div>

            <div class="d-flex justify-content-between mt-4">

                <a href="/step2"
                   class="btn btn-outline-secondary">

                    ← Previous

                </a>

                <button type="submit"
                        class="btn btn-primary btn-lg">

                    Next Step →

                </button>

            </div>

        </form>

        <p class="footer-note">

            🔒︎Your information will only be used for prediction purposes.

        </p>

    </div>

</div>

</body>

</html>
