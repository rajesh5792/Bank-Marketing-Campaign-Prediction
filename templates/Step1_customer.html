<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Step 1 - Customer Information</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="container mt-5">

    <div class="hero">

        <p class="step-text">
            STEP 1 OF 4
        </p>

        <h2>
    <i class="bi bi-person-circle"></i>
    Customer Information
</h2>

        <p class="subtitle">
            Please provide the customer's basic details.
        </p>

        <!-- Progress Section -->

        <div class="progress-wrapper">

            <span class="progress-start">0%</span>

            <div class="custom-progress">

                <div class="custom-progress-bar" style="width:0%;"></div>

            </div>

            <span class="progress-end">100%</span>

        </div>

        <form action="/step1" method="POST">

            <div class="row">

                <!-- Age -->

                <div class="col-md-6 mb-3">

                    <label class="form-label">Age</label>

                    <input type="number"
                           class="form-control"
                           name="age"
                           placeholder="Enter Age"
                           min="18"
                           max="100"
                           required>

                </div>

                <!-- Job -->

                <div class="col-md-6 mb-3">

                    <label class="form-label">Job</label>

                    <select class="form-select"
                            name="job"
                            required>

                        <option value="" selected disabled hidden>
                            Select Job
                        </option>

                        <option value="admin">
                            Admin
                        </option>

                        <option value="technician">
                            Technician
                        </option>

                        <option value="management">
                            Management
                        </option>

                        <option value="services">
                            Services
                        </option>

                    </select>

                </div>

                <!-- Marital -->

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Marital Status
                    </label>

                    <select class="form-select"
                            name="marital"
                            required>

                        <option value="" selected disabled hidden>
                            Select Marital Status
                        </option>

                        <option value="single">
                            Single
                        </option>

                        <option value="married">
                            Married
                        </option>

                        <option value="divorced">
                            Divorced
                        </option>

                    </select>

                </div>

                <!-- Education -->

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Education
                    </label>

                    <select class="form-select"
                            name="education"
                            required>

                        <option value="" selected disabled hidden>
                            Select Education
                        </option>

                        <option value="primary">
                            Primary
                        </option>

                        <option value="secondary">
                            Secondary
                        </option>

                        <option value="university_degree">
                            University Degree
                        </option>

                    </select>

                </div>

            </div>

            <div class="text-center mt-4">

                <button type="submit"
                        class="btn btn-primary btn-lg">

                    Next Step →

                </button>

            </div>

            <p class="footer-note">

                🔒︎Your information will only be used for prediction purposes.

            </p>

        </form>

    </div>

</div>

</body>

</html>
