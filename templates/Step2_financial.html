<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Step 2 - Financial Profile</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="container mt-5">

    <div class="hero">

        <p class="step-text">
            STEP 2 OF 4
        </p>

        <h2>
    <i class="bi bi-wallet2"></i>
    Financial Profile
</h2>

        <p class="subtitle">
            Please provide the customer's financial information.
        </p>

        <!-- Progress Bar -->

        <div class="progress-wrapper">

            <span class="progress-start">25%</span>

            <div class="custom-progress">

                <div class="custom-progress-bar"
                     style="width:25%;">

                </div>

            </div>

            <span class="progress-end">100%</span>

        </div>

        <form action="/step2" method="POST">

            <div class="row">

                <!-- Housing Loan -->

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Housing Loan
                    </label>

                    <select class="form-select"
                            name="housing"
                            required>

                        <option value="" selected disabled hidden>
                            Select Housing Loan
                        </option>

                        <option value="yes">
                            Yes
                        </option>

                        <option value="no">
                            No
                        </option>

                        <option value="unknown">
                            Unknown
                        </option>

                    </select>

                </div>

                <!-- Personal Loan -->

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Personal Loan
                    </label>

                    <select class="form-select"
                            name="loan"
                            required>

                        <option value="" selected disabled hidden>
                            Select Personal Loan
                        </option>

                        <option value="yes">
                            Yes
                        </option>

                        <option value="no">
                            No
                        </option>

                        <option value="unknown">
                            Unknown
                        </option>

                    </select>

                </div>

                <!-- Credit Default -->

                <div class="col-md-12 mb-3">

                    <label class="form-label">
                        Credit in Default
                    </label>

                    <select class="form-select"
                            name="default"
                            required>

                        <option value="" selected disabled hidden>
                            Select Credit Status
                        </option>

                        <option value="no">
                            No
                        </option>

                        <option value="yes">
                            Yes
                        </option>

                        <option value="unknown">
                            Unknown
                        </option>

                    </select>

                </div>

            </div>

            <div class="d-flex justify-content-between mt-4">

                <a href="/step1"
                   class="btn btn-outline-secondary">

                    ← Previous

                </a>

                <button type="submit"
                        class="btn btn-primary btn-lg">

                    Next Step →

                </button>

            </div>

        </form>

        <p class="footer-note">

            🔒︎Your information will only be used for prediction purposes.

        </p>

    </div>

</div>

</body>

</html>
